<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    花生苗 Markdown 编辑器 —— 主界面
    作者：何飞    联系方式：微信 6731663
    开源协议：MIT

    内容安全策略说明：
      · default-src 'self' 只允许加载应用自身资源；
      · img-src 额外允许 file: 与 data:，用于显示本地图片与粘贴的图片；
      · style-src 允许 'unsafe-inline'，因为主题 CSS 是运行时动态注入的。
    frame-src / object-src 一律禁止，防止 Markdown 中嵌套外部页面或插件。
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self';
             style-src 'self' 'unsafe-inline';
             img-src 'self' file: data: blob:;
             font-src 'self' data:;
             media-src 'self' file: data: blob:;
             connect-src 'self';
             frame-src 'none';
             object-src 'none';
             base-uri 'none';
             form-action 'none';"
  />
  <title>花生苗 Markdown 编辑器</title>
  <link rel="stylesheet" href="./renderer.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- ==================== 标题栏（自绘，可拖拽移动窗口） ==================== -->
    <header id="titlebar" class="titlebar">
      <div class="titlebar__left">
        <!-- 应用图标 + 名称 -->
        <div class="titlebar__brand" title="花生苗 Markdown 编辑器 · 作者：何飞 · 微信 6731663">
          <span class="titlebar__logo" aria-hidden="true">🌱</span>
          <span class="titlebar__appname">花生苗 Markdown</span>
        </div>

        <!-- 应用内菜单栏（替代系统菜单，Windows/Linux 无系统菜单栏） -->
        <nav id="menubar" class="menubar" aria-label="主菜单"></nav>
      </div>

      <div class="titlebar__center">
        <span id="tb-filename" class="titlebar__filename">未打开文档</span>
        <span id="tb-dirty" class="titlebar__dirty" hidden title="有未保存的更改">●</span>
      </div>

      <div class="titlebar__right">
        <!-- 视图快捷按钮 -->
        <button id="tb-btn-sidebar" class="iconbtn" title="显示/隐藏侧边栏 (Ctrl+Shift+L)" aria-label="侧边栏">
          <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor"/></svg>
        </button>
        <button id="tb-btn-source" class="iconbtn" title="切换源码/实时预览 (Ctrl+/)" aria-label="源码模式">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 3.5 2.5 8 6 12.5M10 3.5 13.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- 窗口控制按钮（macOS 下隐藏，由系统交通灯接管） -->
        <div id="window-controls" class="wincontrols">
          <button id="win-min" class="wincontrols__btn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 12 12" width="11" height="11"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button id="win-max" class="wincontrols__btn" title="最大化 / 还原" aria-label="最大化">
            <svg viewBox="0 0 12 12" width="11" height="11"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button id="win-close" class="wincontrols__btn wincontrols__btn--close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 12 12" width="11" height="11"><path d="M2.6 2.6 9.4 9.4M9.4 2.6 2.6 9.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ==================== 工具栏（格式操作） ==================== -->
    <div id="toolbar" class="toolbar">
      <div class="toolbar__group">
        <button class="toolbtn" data-command="format.bold" title="加粗 (Ctrl+B)"><b>B</b></button>
        <button class="toolbtn" data-command="format.italic" title="斜体 (Ctrl+I)"><i>I</i></button>
        <button class="toolbtn" data-command="format.underline" title="下划线 (Ctrl+U)"><u>U</u></button>
        <button class="toolbtn" data-command="format.strike" title="删除线 (Ctrl+Shift+X)"><s>S</s></button>
        <button class="toolbtn" data-command="format.highlight" title="高亮 (Ctrl+Shift+H)">🖍</button>
        <button class="toolbtn" data-command="format.inlineCode" title="行内代码 (Ctrl+Shift+`)">&lt;/&gt;</button>
      </div>
      <div class="toolbar__sep"></div>
      <div class="toolbar__group">
        <button class="toolbtn" data-command="format.h1" title="一级标题 (Ctrl+1)">H1</button>
        <button class="toolbtn" data-command="format.h2" title="二级标题 (Ctrl+2)">H2</button>
        <button class="toolbtn" data-command="format.h3" title="三级标题 (Ctrl+3)">H3</button>
        <button class="toolbtn" data-command="format.paragraph" title="普通段落 (Ctrl+0)">¶</button>
      </div>
      <div class="toolbar__sep"></div>
      <div class="toolbar__group">
        <button class="toolbtn" data-command="format.quote" title="引用 (Ctrl+Shift+Q)">❝</button>
        <button class="toolbtn" data-command="format.bulletList" title="无序列表 (Ctrl+Shift+[)">•</button>
        <button class="toolbtn" data-command="format.orderedList" title="有序列表 (Ctrl+Shift+])">1.</button>
        <button class="toolbtn" data-command="format.taskList" title="任务列表 (Ctrl+Shift+C)">☑</button>
      </div>
      <div class="toolbar__sep"></div>
      <div class="toolbar__group">
        <button class="toolbtn" data-command="format.link" title="插入链接 (Ctrl+K)">🔗</button>
        <button class="toolbtn" data-command="format.image" title="插入图片 (Ctrl+Shift+I)">🖼</button>
        <button class="toolbtn" data-command="format.table" title="插入表格 (Ctrl+T)">▦</button>
        <button class="toolbtn" data-command="format.codeBlock" title="插入代码块 (Ctrl+Shift+K)">{ }</button>
        <button class="toolbtn" data-command="format.mathBlock" title="插入公式块 (Ctrl+Shift+M)">∑</button>
        <button class="toolbtn" data-command="format.hr" title="分割线 (Ctrl+Shift+-)">―</button>
      </div>
      <div class="toolbar__spacer"></div>
      <div class="toolbar__group">
        <button class="toolbtn" data-command="edit.find" title="查找 (Ctrl+F)">🔍</button>
        <button class="toolbtn" data-command="file.exportHtml" title="导出 HTML">📤</button>
        <button class="toolbtn" data-command="file.settings" title="设置 (Ctrl+,)">⚙</button>
      </div>
    </div>

    <!-- ==================== 主体区域 ==================== -->
    <div id="body" class="body">

      <!-- 侧边栏 -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar__tabs" role="tablist">
          <button class="sidebar__tab is-active" data-panel="files" role="tab" title="文件树 (Ctrl+Shift+2)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M1.8 3.6A1.1 1.1 0 0 1 2.9 2.5h3.2l1.4 1.6h5.6A1.1 1.1 0 0 1 14.2 5.2v7.1a1.1 1.1 0 0 1-1.1 1.1H2.9A1.1 1.1 0 0 1 1.8 12.3z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
            <span>文件</span>
          </button>
          <button class="sidebar__tab" data-panel="outline" role="tab" title="大纲 (Ctrl+Shift+1)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2.5 4h11M4.5 8h9M6.5 12h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span>大纲</span>
          </button>
          <button class="sidebar__tab" data-panel="search" role="tab" title="全局搜索 (Ctrl+Shift+3)">
            <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>搜索</span>
          </button>
        </div>

        <div class="sidebar__body">
          <!-- 文件树面板 -->
          <div class="panel panel--files is-active" data-panel="files">
            <div class="panel__head">
              <span id="workspace-name" class="panel__title">未打开工作区</span>
              <div class="panel__actions">
                <button id="btn-open-folder" class="iconbtn iconbtn--sm" title="打开文件夹">📂</button>
                <button id="btn-new-file" class="iconbtn iconbtn--sm" title="新建文件">＋</button>
                <button id="btn-refresh-tree" class="iconbtn iconbtn--sm" title="刷新">⟳</button>
              </div>
            </div>
            <div id="filetree" class="filetree" role="tree"></div>
            <div class="panel__section">
              <div class="panel__section-title">
                <span>最近打开</span>
                <button id="btn-clear-recent" class="linkbtn">清空</button>
              </div>
              <div id="recent-list" class="recent"></div>
            </div>
          </div>

          <!-- 大纲面板 -->
          <div class="panel panel--outline" data-panel="outline">
            <div class="panel__head">
              <span class="panel__title">文档大纲</span>
              <div class="panel__actions">
                <button id="btn-refresh-outline" class="iconbtn iconbtn--sm" title="刷新大纲">⟳</button>
              </div>
            </div>
            <div id="outline" class="outline"></div>
          </div>

          <!-- 搜索面板 -->
          <div class="panel panel--search" data-panel="search">
            <div class="panel__head">
              <span class="panel__title">全局搜索</span>
            </div>
            <div class="searchbox">
              <input id="search-input" class="input" type="search" placeholder="输入关键词，回车搜索" />
              <label class="checkline">
                <input id="search-rebuild" type="checkbox" />
                <span>同时重建工作区索引</span>
              </label>
            </div>
            <div id="search-results" class="searchresults"></div>
          </div>
        </div>
      </aside>

      <!-- 侧边栏拖拽把手 -->
      <div id="sidebar-resizer" class="resizer" role="separator" aria-orientation="vertical" title="拖拽调整宽度"></div>

      <!-- 编辑区 -->
      <main id="workspace" class="workspace">
        <div id="tabs" class="tabs" role="tablist"></div>

        <div id="editor-host" class="editor-host">
          <div id="findbar" class="findbar" hidden>
            <div class="findbar__row">
              <input id="find-input" class="input input--sm" type="text" placeholder="查找…" />
              <button id="find-prev" class="iconbtn iconbtn--sm" title="上一个 (Shift+Enter)">↑</button>
              <button id="find-next" class="iconbtn iconbtn--sm" title="下一个 (Enter)">↓</button>
              <span id="find-count" class="findbar__count">0/0</span>
              <button id="find-close" class="iconbtn iconbtn--sm" title="关闭 (Esc)">✕</button>
            </div>
            <div class="findbar__row" id="findbar-replace-row">
              <input id="replace-input" class="input input--sm" type="text" placeholder="替换为…" />
              <button id="replace-one" class="btn btn--sm">替换</button>
              <button id="replace-all" class="btn btn--sm">全部替换</button>
              <div class="findbar__options">
                <label class="checkline checkline--inline"><input id="find-case" type="checkbox" /><span>区分大小写</span></label>
                <label class="checkline checkline--inline"><input id="find-word" type="checkbox" /><span>全字匹配</span></label>
                <label class="checkline checkline--inline"><input id="find-regex" type="checkbox" /><span>正则</span></label>
              </div>
            </div>
          </div>

          <div id="editor-scroll" class="editor-scroll">
            <div id="editor-inner" class="editor-inner"></div>
          </div>

          <!-- 欢迎页（无文档时显示） -->
          <div id="welcome" class="welcome">
            <div class="welcome__logo">🌱</div>
            <h1 class="welcome__title">花生苗 Markdown 编辑器</h1>
            <p class="welcome__slogan">开源免费 · 所见即所得 · 轻量高性能</p>
            <div class="welcome__grid">
              <button class="wcard" data-command="file.new">
                <span class="wcard__icon">📄</span>
                <span class="wcard__title">新建文件</span>
                <span class="wcard__desc">Ctrl + N</span>
              </button>
              <button class="wcard" data-command="file.open">
                <span class="wcard__icon">📂</span>
                <span class="wcard__title">打开文件</span>
                <span class="wcard__desc">Ctrl + O</span>
              </button>
              <button class="wcard" data-command="file.openFolder">
                <span class="wcard__icon">🗂</span>
                <span class="wcard__title">打开文件夹</span>
                <span class="wcard__desc">Ctrl + Shift + O</span>
              </button>
              <button class="wcard" data-command="help.shortcuts">
                <span class="wcard__icon">⌨️</span>
                <span class="wcard__title">快捷键查询</span>
                <span class="wcard__desc">F1</span>
              </button>
            </div>
            <p class="welcome__author">
              作者：何飞 &nbsp;·&nbsp; 微信：6731663 &nbsp;·&nbsp; MIT 开源协议
            </p>
          </div>
        </div>
      </main>
    </div>

    <!-- ==================== 状态栏 ==================== -->
    <footer id="statusbar" class="statusbar">
      <div class="statusbar__left">
        <button id="st-outline-toggle" class="statusitem statusitem--btn" title="切换大纲">☰</button>
        <span id="st-stats" class="statusitem">字数 0 · 词 0 · 行 1 · 阅读 &lt; 1 分钟</span>
      </div>
      <div class="statusbar__center">
        <span id="st-cursor" class="statusitem">行 1，列 1</span>
        <span id="st-selection" class="statusitem" hidden></span>
      </div>
      <div class="statusbar__right">
        <button id="st-mode" class="statusitem statusitem--btn" title="切换源码/实时预览 (Ctrl+/)">实时预览</button>
        <button id="st-theme" class="statusitem statusitem--btn" title="切换明暗模式">跟随系统</button>
        <span id="st-encoding" class="statusitem">UTF-8</span>
        <span id="st-eol" class="statusitem">LF</span>
        <span id="st-lang" class="statusitem">Markdown</span>
        <span id="st-save" class="statusitem statusitem--saved">已保存</span>
      </div>
    </footer>
  </div>

  <!-- 浮层与提示的挂载点 -->
  <div id="overlay-root" class="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="contextmenu-root" class="contextmenu-root"></div>

  <script src="./renderer.js"></script>
</body>
</html>
